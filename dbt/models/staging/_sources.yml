version: 2

sources:
  - name: raw
    description: Respuestas crudas de la API de DummyJSON. Las carga el DAG `src_product_daily_revenue`, una partición por `snapshot_date`.
    schema: raw
    tables:
      - name: products_snapshot
        description: Snapshot diario del catálogo (`/products`). Una fila por producto y fecha.
        columns:
          - name: snapshot_date
            description: Fecha del snapshot; es la partición que se reemplaza en cada carga.
            data_type: date
          - name: id
            description: Id del producto en DummyJSON.
            data_type: integer
          - name: payload
            description: Producto tal como lo devuelve la API.
            data_type: jsonb
          - name: run_id
            description: Corrida de Airflow que cargó la fila.
            data_type: text
          - name: loaded_at
            description: Momento de la carga.
            data_type: timestamp with time zone
      - name: carts_snapshot
        description: Snapshot diario de carritos (`/carts`). Una fila por carrito y fecha; las líneas vienen en `payload.products`.
        columns:
          - name: snapshot_date
            description: Fecha del snapshot; es la partición que se reemplaza en cada carga.
            data_type: date
          - name: id
            description: Id del carrito en DummyJSON.
            data_type: integer
          - name: payload
            description: Carrito tal como lo devuelve la API, con sus líneas.
            data_type: jsonb
          - name: run_id
            description: Corrida de Airflow que cargó la fila.
            data_type: text
          - name: loaded_at
            description: Momento de la carga.
            data_type: timestamp with time zone
