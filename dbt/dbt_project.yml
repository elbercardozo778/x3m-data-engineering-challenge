name: dummyjson_revenue
version: "1.0.0"
config-version: 2
profile: warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  dummyjson_revenue:
    +materialized: incremental
    +incremental_strategy: delete+insert
    staging:
      +schema: staging
      +unique_key: snapshot_date
      +meta: {layer: staging}
    consume:
      +schema: consume
      +unique_key: date
      +meta: {layer: consume}
